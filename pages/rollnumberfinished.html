<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="../styles/belts.css">
    <style>
        #profilePicture {
            margin-bottom: -15px;
            margin-top: 26px;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="hide" class="form-container" style="display: block;">
        <h2>Generate Images</h2>
        <label for="menu1">Image Type:</label>
        <select id="menu1" onchange="updateSelectedValue()">
            <option value="" disabled selected>Select an option</option>
            <option value="Photo">Photo</option>
            <option value="SSC Certificate">SSC Certificate</option>
            <option value="Inter Certificate">Inter Certificate</option>
            <option value="Aadhar">Aadhar</option>
            <option value="Caste Certificate">Caste Certificate</option>
            <option value="Income Certificate">Income Certificate</option>
        </select>
        <p id="selectedMenuValue">No Selection</p>

        <label for="startRoll">Start Roll:</label>
        <input type="text" id="startRoll">

        <label for="endRoll">End Roll:</label>
        <input type="text" id="endRoll">

        <button class="lucas-button" id="che">Generate Images</button>
        <p id="imageCount">Total Images: 0</p>
    </div>
    <div>
        <div id="loa" class="loader" style="display: none;">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div id="imageGallery"></div>
    </div>
    <script src="../scripts/mlritm_db.js"></script>
    <script src="../scripts/erp_registry.js"></script>
    <script src="../scripts/aldjbcaubsjh.js"></script>
    <script src="../scripts/bhasdjhsa.js"></script>
</body>
</html>
