<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px auto;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-sizing: border-box;
        }
        .top-nav a {
            color: #00d9ff;

    <div class="top-nav">

        <a href="selectorcomplete.html">Class Selector &rarr;</a>

    <div id="hide" class="form-container" style="display: block;">
