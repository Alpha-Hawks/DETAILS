<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="../styles/belts2.css">
</head>
<body>
    <div id="headerContainer" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin: 0 auto 15px; flex-wrap: wrap; gap: 10px;">
        <h1 id="exampleHeading" style="margin: 0;">Image Gallery</h1>
        <div style="display: flex; gap: 8px;">
            <a href="../mlritm.html" style="color: #c9d1d9; background: #21262d; border: 1px solid #30363d; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px;">← MLRITM Hub</a>
            <button type="button" onclick="openErpMenu()" style="background: #238636; border: 1px solid #2ea043; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;">🏛️ Anvaya ERP</button>
        </div>
    </div>

    <div id="selectContainer" style="display: block; margin-top: 20px; text-align: center;">
        <h2>CHOOSE</h2> 
        <center><div class="select-container">
            <form id="myForm">
                <label for="menu1">Image:</label>
                <select id="menu1">
                    <option value="" disabled selected>Select an Image</option>
                    <option value="Photo">Photo</option>
                    <option value="SSC Certificate">SSC Certificate</option>
                    <option value="Inter Certificate">Inter Certificate</option>
                    <option value="Aadhar">Aadhar</option>
                    <option value="Caste Certificate">Caste Certificate</option>
                    <option value="Income Certificate">Income Certificate</option>
                </select>
                <br>
                <label for="menu2">Year:</label>
                <select id="menu2">
                    <option value="" disabled selected>Select Year</option>
                </select>
                <br>
                <label for="menu3">Branch:</label>
                <select id="menu3">
                    <option value="" disabled selected>Select Branch</option>
                </select>
                <br>
                <label for="menu4">Class:</label>
                <select id="menu4">
                    <option value="" disabled selected>Select Section</option>
                </select>
                <br>
                <button type="button" id="showSelectedBtn">Show Selected Values</button>
                <button type="button" id="erpPortalBtn" onclick="openErpMenu()" style="background:#238636; border:1px solid #2ea043; color:#fff; padding:10px 18px; border-radius:5px; font-size:16px; font-weight:600; cursor:pointer; margin-left:10px;">🏛️ Anvaya ERP</button>
            </form></center>
            <center><p id="imageCount">Total Images: 0</p> </center>
            <div id="notfound"></div>
            <center><div>
                <br><br>
                <div id="loar" class="loader" style="display: none;">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div></center>
            <div id="imageGallery"></div>
        </div>
    </div>

    <p id="result"></p>

    <script src="../scripts/mlritm_db.js" defer></script>
    <script src="../scripts/erp_registry.js" defer></script>
    <script src="../scripts/favcgushfjj.js" defer></script>
    <script src="../scripts/apas.js" defer></script>
</body>
</html>
